<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM Gateway</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">LOCAL-FIRST LLM GATEWAY</p>
          <h1>Chat Console</h1>
        </div>
        <span id="status" class="status">checking…</span>
      </header>

      <section class="toolbar">
        <label>Model <input id="model" value="local/qwen3.8-27b-q5ks" /></label>
        <label>Temperature <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.2" /></label>
        <label>Max tokens <input id="maxTokens" type="number" min="1" value="512" /></label>
        <button id="clear" type="button">Clear</button>
      </section>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="composer" class="composer">
        <textarea id="prompt" rows="3" placeholder="輸入訊息…" required></textarea>
        <div class="composer-actions">
          <span class="hint">Gateway 只使用本地或後端 SecretStore，瀏覽器不接觸 Provider key。</span>
          <button id="send" type="submit">Send</button>
        </div>
      </form>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
